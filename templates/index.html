<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wine Quality Predictor - IT325 PIT</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #219150; }
        .result { margin-top: 20px; text-align: center; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wine Quality Predictor</h2>
        <form action="/predict" method="post">
            <input type="text" name="fixed_acidity" placeholder="Fixed Acidity" required>
            <input type="text" name="volatile_acidity" placeholder="Volatile Acidity" required>
            <input type="text" name="citric_acid" placeholder="Citric Acid" required>
            <input type="text" name="residual_sugar" placeholder="Residual Sugar" required>
            <input type="text" name="chlorides" placeholder="Chlorides" required>
            <input type="text" name="free_sulfur" placeholder="Free Sulfur Dioxide" required>
            <input type="text" name="total_sulfur" placeholder="Total Sulfur Dioxide" required>
            <input type="text" name="density" placeholder="Density" required>
            <input type="text" name="ph" placeholder="pH" required>
            <input type="text" name="sulphates" placeholder="Sulphates" required>
            <input type="text" name="alcohol" placeholder="Alcohol" required>
            <button type="submit">Predict Quality</button>
        </form>
        {% if prediction_text %}
            <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
