<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wine Quality Predictor - IT325 PIT</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #f4f4f9; 
            padding: 20px; 
        }
        .container { 
            background: white; 
            max-width: 800px; /* Widened to fit 3 columns */
            margin: auto; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #2c3e50; 
            text-align: center; 
            margin-bottom: 25px;
        }
        
        /* CSS Grid to split into 3 columns/rows */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        input { 
            width: 100%; 
            padding: 10px; 
            margin: 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
        }
        
        /* Make the button span all 3 columns at the bottom */
        button { 
            grid-column: span 3;
            width: 100%; 
            padding: 12px; 
            margin-top: 10px;
            background-color: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { 
            background-color: #219150; 
        }
        .result { 
            margin-top: 20px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.2em;
            color: #e67e22; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Wine Quality Predictor</h2>
        
        <!-- Added the .form-grid class to your form -->
        <form action="/predict" method="post" class="form-grid">
            <input type="number" name="fixed_acidity" placeholder="Fixed Acidity" min="0" max="20" step="any" required>
            <input type="number" name="volatile_acidity" placeholder="Volatile Acidity" min="0" max="20" step="any" required>
            <input type="number" name="citric_acid" placeholder="Citric Acid" min="0" max="20" step="any" required>
            <input type="number" name="residual_sugar" placeholder="Residual Sugar" min="0" max="20" step="any" required>
            <input type="number" name="chlorides" placeholder="Chlorides" min="0" max="20" step="any" required>
            <input type="number" name="free_sulfur" placeholder="Free Sulfur Dioxide" min="0" max="20" step="any" required>
            <input type="number" name="total_sulfur" placeholder="Total Sulfur Dioxide" min="0" max="20" step="any" required>
            <input type="number" name="density" placeholder="Density" min="0" max="20" step="any" required>
            <input type="number" name="ph" placeholder="pH" min="0" max="20" step="any" required>
            <input type="number" name="sulphates" placeholder="Sulphates" min="0" max="20" step="any" required>
            <input type="number" name="alcohol" placeholder="Alcohol" min="0" max="20" step="any" required>
            
            <button type="submit">Predict Quality</button>
        </form>

        {% if prediction_text %}
            <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
